version: "2"

linters:
  # enabled in addition to the v2 defaults
  enable:
    - gosec
  exclusions:
    # Excluding configuration per-path, per-linter, per-text and per-source
    rules:
      # Test fixtures intentionally use fake credential-like values and marshal
      # fake access tokens. Keep those false positives narrow by rule.
      - path: _test\.go
        linters:
          - gosec
        text: "G101|G117"
      # ncryptsigner is a thin wrapper over the Windows CNG/NCrypt syscall surface, where handing an
      # unsafe.Pointer to syscall.SyscallN and CertFindCertificateInStore is the only way to call the
      # API at all. G103 flags every such call, so scope the exclusion to that one package instead of
      # scattering suppressions through it. Every other gosec rule still applies there.
      - path: apps/tests/devapps/keyguard/ncryptsigner/
        linters:
          - gosec
        text: "G103"
      # keyprovider_windows.go has the same shape: it is the CNG/NCrypt syscall
      # surface for minting a KeyGuard binding key, and passing unsafe.Pointer to
      # syscall.SyscallN is the only way to call NCrypt at all. Scope the exclusion
      # to that one file rather than the whole managedidentity package, so G103
      # still applies to the rest of it. Every other gosec rule still applies here.
      - path: apps/managedidentity/keyprovider_windows\.go
        linters:
          - gosec
        text: "G103"
      # attestation_windows.go is the same case: the only way to call into
      # AttestationClientLib.dll is to hand unsafe.Pointer values to
      # syscall.SyscallN. Scoped to this one file so G103 still applies to the
      # rest of the package, and every other gosec rule still applies here.
      - path: apps/managedidentity/attestation_windows\.go
        linters:
          - gosec
        text: "G103"
      # imdsv2_persist_windows.go is the same case again: it is the crypt32
      # certificate-store surface, and the two property calls it needs are not
      # in x/sys, so they are invoked through syscall.SyscallN with
      # unsafe.Pointer arguments. Scoped to this one file so G103 still applies
      # to the rest of the package, and every other gosec rule still applies
      # here.
      - path: apps/managedidentity/imdsv2_persist_windows\.go
        linters:
          - gosec
        text: "G103"
