name: golangci-lint
on:
  push:
    tags:
      - v*
    branches:      
      - main      
  pull_request:
    # No `branches:` filter, so this runs on ALL pull requests regardless of the
    # target branch (defaults to opened, synchronize, reopened).

# golangci-lint reports findings as workflow log annotations rather than through the Checks
# API, and only-new-issues (which would need pull-requests: read) is not enabled, so both
# lint jobs need nothing beyond contents: read.
permissions:
  contents: read

jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@v6
        with:
          go-version: "1.22"
      - uses: actions/checkout@v5
      - name: golangci-lint
        # Pinned to a commit hash rather than the mutable v9 tag: this is the only third-party
        # action in this repository, so a tag repoint here would run unreviewed code with access
        # to the workflow token. ba0d7d2 is v9.3.0.
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # Required: the version of golangci-lint is required and must be specified without patch version: we always use the latest patch version.
          version: v2.12

  # golangci-lint analyses one GOOS at a time, so the run above never sees a //go:build windows file.
  # Cross-analysing the same tree with GOOS=windows lints the KeyGuard/CNG packages without needing a
  # Windows runner. Kept as a separate job so the existing "lint" check name is unchanged.
  golangci-windows:
    name: lint (windows)
    runs-on: ubuntu-latest
    env:
      GOOS: windows
    steps:
      - uses: actions/setup-go@v6
        with:
          go-version: "1.22"
      - uses: actions/checkout@v5
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12

          # Optional: golangci-lint command line arguments.
          # args: --issues-exit-code=0
