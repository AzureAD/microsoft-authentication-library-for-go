name: Go

on:
  push:
    branches: [main]
  pull_request:
    # No `branches:` filter, so this runs on ALL pull requests regardless of the
    # target branch (defaults to opened, synchronize, reopened).

permissions:
  contents: read

jobs:
  build:
    name: Build

    runs-on: ubuntu-latest

    strategy:
      matrix:
        go: ["1.21", "1.22"]

    steps:
      - name: Set up Go 1.x
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ matrix.go }}
        id: go

      - name: Check out code into the Go module directory
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Get dependencies
        run: go get -v -t -d ./...

      - name: Check formatting
        if: matrix.go == '1.22'
        shell: bash
        run: |
          unformatted="$(gofmt -l -s .)"
          if [ -n "$unformatted" ]; then
            echo "The following files need formatting:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        run: go build ./apps/...

      - name: Unit Tests
        run: go test -race -short ./apps/cache/... ./apps/confidential/... ./apps/public/... ./apps/internal/... ./apps/managedidentity/...
      # Intergration tests runs on ADO
      # - name: Integration Tests
      #   run: go test -race ./apps/tests/integration/...
