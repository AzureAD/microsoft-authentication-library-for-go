name: Go

on:
  push:
    branches: [main]
  pull_request:
    # No `branches:` filter, so this runs on ALL pull requests regardless of the
    # target branch (defaults to opened, synchronize, reopened).

# Every job here only reads the repository: check out, build, and test. None writes a
# comment, status, package, or release, so the token needs nothing beyond contents: read.
permissions:
  contents: read

jobs:
  build:
    name: Build

    runs-on: ubuntu-latest

    strategy:
      matrix:
        # 1.20 is here to compile the pre-1.21 side of the build tags. go.mod declares go 1.18, but
        # imdsv2_alert_pre121.go is //go:build !go1.21, so a matrix that starts at 1.21 never parses
        # it: the file could stop compiling and every job would still pass. 1.21 and 1.22 cover the
        # go1.21 side and the toolchains the module actually targets.
        go: ["1.20", "1.21", "1.22"]

    steps:
      - name: Set up Go 1.x
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
        id: go

      - name: Check out code into the Go module directory
        uses: actions/checkout@v5

      - name: Get dependencies
        run: go get -v -t -d ./...

        # designed to only run on linux
        # - name: Format Check
        # run: if [ $(gofmt -l -s . | wc -l) -ne 0 ]; then echo "fmt failed"; exit 1; fi

      - name: Build
        run: go build ./apps/...

      - name: Unit Tests
        run: go test -race -short ./apps/cache/... ./apps/confidential/... ./apps/public/... ./apps/internal/... ./apps/managedidentity/...
      # Intergration tests runs on ADO
      # - name: Integration Tests
      #   run: go test -race ./apps/tests/integration/...
      #   env :
      #     clientId: ${{ secrets.LAB_APP_CLIENT_ID }}
      #     clientSecret: ${{ secrets.LAB_APP_CLIENT_SECRET }}
      #     oboConfidentialClientId: ${{ secrets.OBO_CONFIDENTIAL_APP_CLIENT_ID }}
      #     oboConfidentialClientSecret: ${{ secrets.OBO_CONFIDENTIAL_APP_CLIENT_SECRET }}
      #     oboPublicClientId: ${{ secrets.OBO_PUBLIC_APP_CLIENT_ID }}
      #     CI: ${{secrets.ENABLECI}}

  # The KeyGuard/CNG dev app and its ncryptsigner package are //go:build windows. On a Linux runner
  # they are not merely skipped, they are absent from the package graph entirely: "go list ./apps/..."
  # does not name them and "go build ./apps/..." succeeds without ever parsing them. That made the
  # NCrypt interop -- the least portable code in the repo -- the only code here with no automated
  # verification at all. This job compiles and tests it.
  build-windows:
    name: Build (windows)

    runs-on: windows-latest

    steps:
      - name: Set up Go 1.x
        uses: actions/setup-go@v6
        with:
          go-version: "1.22"
        id: go

      - name: Check out code into the Go module directory
        uses: actions/checkout@v5

      - name: Get dependencies
        run: go get -v -t -d ./...

      - name: Build
        run: go build ./apps/...

      # ./apps/tests/devapps/... is what reaches the KeyGuard packages; the other dev apps report
      # "no test files" and cost nothing.
      #
      # -race matters specifically on this job. The Linux job above already races
      # ./apps/managedidentity/..., but the Windows-only files in that package -- the CNG key
      # provider, the certificate store, and the attestation interop -- are absent from the Linux
      # package graph, so the binding-certificate cache, its reference counting, and the mint gate
      # are never raced on the platform whose code they actually guard. The windows-latest image
      # ships a C toolchain, so cgo and the race detector are available here. CGO_ENABLED is set
      # explicitly so that a future image without gcc fails on this step with a clear cause rather
      # than silently dropping to CGO_ENABLED=0.
      - name: Unit Tests
        env:
          CGO_ENABLED: "1"
        run: go test -race -short ./apps/cache/... ./apps/confidential/... ./apps/public/... ./apps/internal/... ./apps/managedidentity/... ./apps/tests/devapps/...
