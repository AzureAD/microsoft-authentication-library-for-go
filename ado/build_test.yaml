trigger:
  - main

parameters:
  - name: coldAttestation
    displayName: "Force a fresh optional-attestation statement"
    type: boolean
    default: false

schedules:
  - cron: "0 8 * * 0"
    displayName: "Weekly cold optional-attestation validation"
    branches:
      include:
        - main
    always: true

pr:
  autoCancel: false
  branches:
    include:
      - main

variables:
  goVersion: "1.22.3"

stages:
  # ──────────────────────────────────────────────
  # Stage 1 — Build
  # ──────────────────────────────────────────────
  - stage: Build
    displayName: "Build"
    dependsOn: []
    jobs:
      - job: Build
        displayName: "Build MSAL Go"
        pool:
          vmImage: "ubuntu-latest"
        steps:
          - task: GoTool@0
            inputs:
              version: $(goVersion)
          - task: Go@0
            inputs:
              command: "get"
              arguments: "-d -v -t -d ./..."
              workingDirectory: "$(System.DefaultWorkingDirectory)"
            displayName: "Install dependencies"
          - task: Go@0
            inputs:
              command: "build"
              arguments: "./apps/..."
              workingDirectory: "$(System.DefaultWorkingDirectory)"
            displayName: "Build"

  # ──────────────────────────────────────────────
  # Stage 2 — Unit Tests
  # ──────────────────────────────────────────────
  - stage: UnitTests
    displayName: "Unit Tests"
    dependsOn: Build
    jobs:
      - job: UnitTests
        displayName: "Run Unit Tests"
        pool:
          vmImage: "ubuntu-latest"
        steps:
          - task: GoTool@0
            inputs:
              version: $(goVersion)
          - task: Go@0
            inputs:
              command: "get"
              arguments: "-d -v -t -d ./..."
              workingDirectory: "$(System.DefaultWorkingDirectory)"
            displayName: "Install dependencies"
          - task: Bash@3
            displayName: "Run Unit Tests"
            inputs:
              targetType: "inline"
              workingDirectory: "$(System.DefaultWorkingDirectory)"
              script: |
                set -e
                (cd "$(Build.SourcesDirectory)/build/tools" && go install gotest.tools/gotestsum)
                export PATH="$PATH:$(go env GOPATH)/bin"
                gotestsum --junitfile "$(Build.SourcesDirectory)/unit-tests.xml" -- \
                  -race -short ./apps/cache/... ./apps/confidential/... ./apps/public/... ./apps/internal/... ./apps/managedidentity/...
          - task: PublishTestResults@2
            displayName: "Publish unit test results"
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: "JUnit"
              testResultsFiles: "**/unit-tests.xml"
              testRunTitle: "Unit Tests"

  # ──────────────────────────────────────────────
  # Stage 3 — Integration Tests
  # ──────────────────────────────────────────────
  - stage: IntegrationTests
    displayName: "Integration Tests"
    dependsOn: Build
    jobs:
      - job: IntegrationTests
        displayName: "Run Integration Tests"
        pool:
          vmImage: "ubuntu-latest"
        steps:
          - task: GoTool@0
            inputs:
              version: $(goVersion)
          - task: Go@0
            inputs:
              command: "get"
              arguments: "-d -v -t -d ./..."
              workingDirectory: "$(System.DefaultWorkingDirectory)"
            displayName: "Install dependencies"
          - task: AzureKeyVault@2
            displayName: "Connect to Key Vault"
            inputs:
              azureSubscription: "AuthSdkResourceManager"
              KeyVaultName: "msidlabs"
              SecretsFilter: "LabAuth,IDLABS-APP-Confidential-Client-Cert-OnPrem"
          - task: Bash@3
            displayName: "Installing certificate"
            inputs:
              targetType: "inline"
              script: |
                echo $(LabAuth) | base64 -d > $(Build.SourcesDirectory)/cert.pfx
                OPENSSL_CONF=/dev/null openssl pkcs12 -in $(Build.SourcesDirectory)/cert.pfx -out $(Build.SourcesDirectory)/cert.pem -nodes -passin pass:'' -legacy
                echo "$(IDLABS-APP-Confidential-Client-Cert-OnPrem)" | base64 -d > $(Build.SourcesDirectory)/ccaCert.pfx
                OPENSSL_CONF=/dev/null openssl pkcs12 -in $(Build.SourcesDirectory)/ccaCert.pfx -out $(Build.SourcesDirectory)/ccaCert.pem -nodes -passin pass:'' -legacy
          - task: Bash@3
            displayName: "Run Integration Tests"
            inputs:
              targetType: "inline"
              workingDirectory: "$(System.DefaultWorkingDirectory)"
              script: |
                set -e
                (cd "$(Build.SourcesDirectory)/build/tools" && go install gotest.tools/gotestsum)
                export PATH="$PATH:$(go env GOPATH)/bin"
                gotestsum --junitfile "$(Build.SourcesDirectory)/integration-tests.xml" -- \
                  -race ./apps/tests/integration/...
          - task: PublishTestResults@2
            displayName: "Publish integration test results"
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: "JUnit"
              testResultsFiles: "**/integration-tests.xml"
              testRunTitle: "Integration Tests"

  # ──────────────────────────────────────────────
  # Stage 4 — Managed Identity E2E Tests (IMDS v1 and v2)
  #
  # Runs on the self-hosted "MISEManagedIdentity" VM (Windows), which has a
  # system-assigned managed identity plus the user-assigned managed identities
  # assigned to it and IMDS reachable. These are the SAME identities used by the
  # MSAL .NET IMDS E2E tests, so both SDKs exercise the same lab configuration.
  #
  # The -run filter selects both suites:
  #   TestManagedIdentityImds  — IMDS v1 (bearer tokens)
  #   TestIMDSv2*              — IMDS v2 (mTLS proof-of-possession, KeyGuard-bound)
  # The v2 tests skip with an explicit reason when the agent serves IMDSv1 only,
  # lacks Credential Guard, or has no identity assigned, so they cannot red the
  # build on an agent that is not provisioned for them. Check the test log for
  # skips before treating a green run as v2 coverage.
  #
  # Runs on every PR. Go is installed only when the VM does not already have it
  # (checked below) so we don't re-install Go on every run.
  # ──────────────────────────────────────────────
  - stage: MIE2EIMDS
    displayName: "MI E2E – IMDS"
    dependsOn: [] # Builds from source — independent of the Build stage
    jobs:
      - job: RunManagedIdentityE2ETestsOnImds
        displayName: "Managed Identity E2E Tests – VM / IMDS"
        pool:
          name: "MISEManagedIdentity"
        steps:
          - task: PowerShell@2
            displayName: "Check for Go"
            inputs:
              targetType: "inline"
              script: |
                $go = Get-Command go -ErrorAction SilentlyContinue
                if ($go) {
                  Write-Host "Go already installed: $(go version)"
                  Write-Host "##vso[task.setvariable variable=goInstalled]true"
                } else {
                  Write-Host "Go not found on agent; it will be installed."
                  Write-Host "##vso[task.setvariable variable=goInstalled]false"
                }
          - task: GoTool@0
            displayName: "Install Go (only if missing)"
            condition: eq(variables['goInstalled'], 'false')
            inputs:
              version: $(goVersion)
          - task: PowerShell@2
            displayName: "Ensure Visual C++ attestation runtime"
            inputs:
              targetType: "inline"
              script: |
                $ErrorActionPreference = "Stop"
                $systemDir = Join-Path $env:WINDIR "System32"
                $runtimeFiles = @("MSVCP140.dll", "VCRUNTIME140.dll", "VCRUNTIME140_1.dll")

                function Assert-MicrosoftSigned([string]$path) {
                  if (-not [IO.File]::Exists($path)) {
                    throw "required Visual C++ runtime file is missing: $path"
                  }
                  $signature = Get-AuthenticodeSignature -LiteralPath $path
                  if ($signature.Status -ne "Valid") {
                    throw "$path does not have a valid Authenticode signature"
                  }
                  if ($signature.SignerCertificate.Subject -notmatch '(?:^|,\s)O=Microsoft Corporation(?:,|$)') {
                    throw "$path is not signed by Microsoft Corporation"
                  }
                }

                $missing = @($runtimeFiles | Where-Object {
                  -not [IO.File]::Exists((Join-Path $systemDir $_))
                })
                if ($missing.Count -ne 0) {
                  $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
                  $principal = [Security.Principal.WindowsPrincipal]::new($identity)
                  if (-not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
                    throw "installing the Visual C++ Redistributable requires an elevated test agent"
                  }

                  $source = "https://aka.ms/vc14/vc_redist.x64.exe"
                  $installer = Join-Path "$(Agent.TempDirectory)" "vc_redist.x64.exe"
                  try {
                    Invoke-WebRequest -UseBasicParsing -Uri $source -OutFile $installer
                    Assert-MicrosoftSigned $installer
                    $installerVersion = [Diagnostics.FileVersionInfo]::GetVersionInfo($installer).FileVersion
                    Write-Host "Downloaded Microsoft-signed Visual C++ x64 Redistributable $installerVersion from $source"

                    $install = Start-Process -FilePath $installer `
                      -ArgumentList @("/install", "/quiet", "/norestart") `
                      -Wait -PassThru
                    # Windows ERROR_SUCCESS and ERROR_SUCCESS_REBOOT_REQUIRED.
                    if ($install.ExitCode -notin @(0, 3010)) {
                      throw "Visual C++ Redistributable installer exited with code $($install.ExitCode)"
                    }
                    if ($install.ExitCode -eq 3010) {
                      Write-Host "Visual C++ Redistributable installation succeeded and reported reboot required"
                    } else {
                      Write-Host "Visual C++ Redistributable installation succeeded"
                    }
                  } finally {
                    if ([IO.File]::Exists($installer)) {
                      Remove-Item -LiteralPath $installer -Force
                    }
                  }
                } else {
                  Write-Host "Visual C++ x64 runtime is already installed in System32"
                }

                foreach ($name in $runtimeFiles) {
                  $path = Join-Path $systemDir $name
                  Assert-MicrosoftSigned $path
                  $version = [Diagnostics.FileVersionInfo]::GetVersionInfo($path).FileVersion
                  Write-Host "  $name ${version}: present in System32 with valid Microsoft signature"
                }
          - task: PowerShell@2
            displayName: "Run KeyGuard and certificate store hardware tests"
            inputs:
              targetType: "inline"
              workingDirectory: "$(System.DefaultWorkingDirectory)"
              script: |
                $ErrorActionPreference = "Stop"
                # These drive the real VBS-isolated key through NCrypt and the real
                # CurrentUser\My store through crypt32. They are the only automated
                # coverage for that interop, and they are opt-in because they need
                # KeyGuard hardware and mutate machine state, so this pool is the
                # only place they can run at all. Left unset they skip, and a skipped
                # test stage is indistinguishable from a passing one.
                $env:MSAL_TEST_REAL_KEYGUARD = "1"
                $env:MSAL_TEST_REAL_CERT_STORE = "1"
                # The store tests scope every entry to an alias generated for the run
                # and remove it in cleanup. The KeyGuard tests deliberately keep the
                # key: the container is shared with MSAL .NET, and deleting it would
                # invalidate every certificate either library has already persisted.
                $results = Join-Path "$(Agent.TempDirectory)" "managedidentity-hardware-tests.json"
                # Windows PowerShell turns redirected native stderr into ErrorRecord
                # objects. Go writes module downloads there even on success, so keep
                # processing until the explicit native exit-code check below.
                $ErrorActionPreference = "Continue"
                $output = & go test ./apps/managedidentity/ -run "RealKeyGuard|RealStore" -count=1 -json 2>&1
                $exit = $LASTEXITCODE
                $ErrorActionPreference = "Stop"
                $output | ForEach-Object { $_.ToString() } | Set-Content -LiteralPath $results -Encoding UTF8
                & "$(Build.SourcesDirectory)\ado\validate_hardware_test_results.ps1" -Path $results
                if ($exit -ne 0) { throw "KeyGuard/certificate store hardware tests failed" }
          - task: PowerShell@2
            displayName: "Run Managed Identity IMDS E2E Tests"
            inputs:
              targetType: "inline"
              workingDirectory: "$(System.DefaultWorkingDirectory)"
              script: |
                $ErrorActionPreference = "Stop"
                go version
                Push-Location "$(Build.SourcesDirectory)\build\tools"
                go install gotest.tools/gotestsum
                Pop-Location
                $env:PATH = "$env:PATH;$(go env GOPATH)\bin"
                # This agent is provisioned for managed identity, so an IMDSv2 environment skip is a
                # regression rather than a legitimate gap. Without this the tests would skip and the
                # stage would still report green, which looks identical to real coverage.
                $env:IMDSV2_E2E_REQUIRED = "true"
                # The MISEManagedIdentity pool is the same pool MSAL .NET runs its IMDSv2 E2E stage
                # on, so the identity and the token-binding vault below are already provisioned on
                # this agent and are the same ones .NET asserts against. Keeping both libraries on
                # one environment is what makes a cross-language parity claim meaningful.
                $env:IMDSV2_E2E_USER_ASSIGNED_CLIENT_ID = "6325cd32-9911-41f3-819c-416cdf9104e7"
                $env:IMDSV2_E2E_VAULT = "tokenbindingdemo.vault.azure.net"
                $env:IMDSV2_E2E_SECRET = "boundsecret"
                $coldAttestation = [Convert]::ToBoolean('${{ parameters.coldAttestation }}') -or $env:BUILD_REASON -eq "Schedule"

                # The optional module owns the IMDSv2 tests so the root module does
                # not acquire a dependency on its optional child. Its development
                # replace resolves the unreleased core from this exact checkout.
                gotestsum --junitfile "$(Build.SourcesDirectory)\mi-e2e-imdsv1-tests.xml" -- `
                  -tags e2e -count=1 -run '^TestManagedIdentityImds$' -v ./apps/tests/e2e
                if ($LASTEXITCODE -ne 0) { throw "managed identity IMDSv1 e2e tests failed" }

                $dllName = "AttestationClientLib.dll"
                $expectedHash = "90dfcce20e1a74519b49796eeee17e6e59a257c3acf754f454a49380d28a568b"
                $expectedPath = Join-Path $env:LOCALAPPDATA "Microsoft\MSAL\attestation\1.1.5\win-x64\$dllName"
                if (-not [IO.Path]::IsPathRooted($expectedPath)) {
                  throw "the expected attestation path is not absolute"
                }
                $searchDirs = @(
                  "$(Build.SourcesDirectory)\attestation\e2e",
                  (Join-Path $env:WINDIR "System32")
                ) + @($env:PATH -split ';' | Where-Object { $_ -and [IO.Directory]::Exists($_) })
                $unexpected = @($searchDirs | Select-Object -Unique | Where-Object {
                  [IO.File]::Exists((Join-Path $_ $dllName))
                })
                if ($unexpected.Count -ne 0) {
                  throw "AttestationClientLib.dll unexpectedly exists in an application search location"
                }
                Write-Host "AttestationClientLib.dll is absent from the test CWD, System32, and PATH directories; the test also checks its temporary executable directory."

                $existedBefore = [IO.File]::Exists($expectedPath)
                $hashBefore = if ($existedBefore) {
                  (Get-FileHash -LiteralPath $expectedPath -Algorithm SHA256).Hash.ToLowerInvariant()
                } else { "" }
                $writeTimeBefore = if ($existedBefore) {
                  [IO.File]::GetLastWriteTimeUtc($expectedPath)
                } else { [DateTime]::MinValue }

                if ($coldAttestation) {
                  $env:IMDSV2_E2E_COLD_ATTESTATION = "true"
                  Write-Host "Preparing the exact system-assigned attested certificate alias for cold-path validation"
                  go test -tags e2e -count=1 -run '^TestPrepareColdAttestationSystemAssigned$' -v ./apps/managedidentity
                  if ($LASTEXITCODE -ne 0) { throw "preparing the cold optional-attestation path failed" }

                  Push-Location "$(Build.SourcesDirectory)\attestation"
                  gotestsum --junitfile "$(Build.SourcesDirectory)\mi-e2e-imdsv2-cold-tests.xml" -- `
                    -tags e2e -count=1 -run '^TestIMDSv2SystemAssignedBoundToken$' -v ./e2e
                  $coldExit = $LASTEXITCODE
                  Pop-Location
                  if ($coldExit -ne 0) { throw "cold optional-attestation IMDSv2 e2e test failed" }
                  Remove-Item Env:IMDSV2_E2E_COLD_ATTESTATION
                }

                Push-Location "$(Build.SourcesDirectory)\attestation"
                gotestsum --junitfile "$(Build.SourcesDirectory)\mi-e2e-imdsv2-tests.xml" -- `
                  -tags e2e -count=1 -run '^TestIMDSv2' -v ./e2e
                $testExit = $LASTEXITCODE
                Pop-Location
                if ($testExit -ne 0) { throw "managed identity optional-attestation IMDSv2 e2e tests failed" }

                if (-not [IO.File]::Exists($expectedPath)) {
                  throw "the optional module did not materialize AttestationClientLib.dll at the expected path"
                }
                $hash = (Get-FileHash -LiteralPath $expectedPath -Algorithm SHA256).Hash.ToLowerInvariant()
                if ($hash -ne $expectedHash) {
                  throw "the materialized AttestationClientLib.dll hash does not match the pinned asset"
                }
                $signature = Get-AuthenticodeSignature -LiteralPath $expectedPath
                if ($signature.Status -ne "Valid") {
                  throw "the materialized AttestationClientLib.dll signature is not valid"
                }
                if ($signature.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') {
                  throw "the materialized AttestationClientLib.dll is not signed by Microsoft"
                }
                $materialization = "fresh extraction"
                if ($existedBefore) {
                  $materialization = "repaired extraction"
                  if ($hashBefore -eq $expectedHash -and
                      $writeTimeBefore -eq [IO.File]::GetLastWriteTimeUtc($expectedPath)) {
                    $materialization = "verified reuse"
                  }
                }
                Write-Host "Optional attestation delivery verified: $materialization"
                Write-Host "  absolute path: $expectedPath"
                Write-Host "  SHA-256: $hash"
                Write-Host "  Authenticode: Valid, Microsoft Corporation"
          - task: PublishTestResults@2
            displayName: "Publish MI E2E test results"
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: "JUnit"
              testResultsFiles: "**/mi-e2e-imds*-tests.xml"
              testRunTitle: "MI E2E – IMDS"

  # ──────────────────────────────────────────────
  # Stage 5 — Managed Identity E2E Tests (Azure Arc)
  #
  # Runs on the self-hosted "MISEAZUREARC" pool, an Azure Arc-enabled machine.
  # Azure Arc supports the system-assigned identity only. Mirrors the MSAL .NET
  # Azure Arc E2E test.
  #
  # Runs on every PR. Go is installed only when the machine does not already have
  # it (checked below) so we don't re-install Go on every run.
  # ──────────────────────────────────────────────
  - stage: MIE2EAzureArc
    displayName: "MI E2E – Azure Arc"
    dependsOn: [] # Builds from source — independent of the Build stage
    jobs:
      - job: RunManagedIdentityE2ETestsOnAzureArc
        displayName: "Managed Identity E2E Tests – Azure Arc"
        pool:
          name: "MISEAZUREARC"
        # The Arc agent's Go/.NET TLS is reset by egress inspection, so
        # "go install" / "go test" can't fetch modules from proxy.golang.org.
        # curl (Schannel) is NOT blocked, so we warm a private module cache with
        # curl from go.sum, then run "go test" offline (GOPROXY=off).
        steps:
          - task: PowerShell@2
            displayName: "Run Managed Identity Azure Arc E2E Tests"
            inputs:
              targetType: "inline"
              workingDirectory: "$(System.DefaultWorkingDirectory)"
              script: |
                $ErrorActionPreference = "Stop"
                $env:PATH = "C:\Go\bin;$env:PATH"
                $env:GOTOOLCHAIN = "local"
                go version

                # Prefer a pre-baked module cache at C:\gomodcache (copied onto
                # the agent out-of-band). If it's absent, fall back to warming a
                # cache with curl (Schannel isn't TLS-blocked like Go's downloader).
                $prebaked = "C:\gomodcache"
                if (Test-Path (Join-Path $prebaked "cache\download")) {
                  Write-Host "Using pre-baked module cache at $prebaked"
                  $env:GOMODCACHE = $prebaked
                } else {
                  Write-Host "No pre-baked cache found; warming from go.sum via curl"
                  $cache = Join-Path "$(Agent.TempDirectory)" "gomodcache"
                  $dl = Join-Path $cache "cache\download"
                  $seen = @{}
                  Get-Content "go.sum" | ForEach-Object {
                    $p = $_ -split '\s+'
                    if ($p.Count -lt 2) { return }
                    $mod = $p[0]
                    $ver = $p[1] -replace '/go.mod$',''
                    $key = "$mod@$ver"
                    if ($seen[$key]) { return }
                    $seen[$key] = $true
                    $esc = -join ($mod.ToCharArray() | ForEach-Object {
                      if ($_ -cmatch '[A-Z]') { '!' + [char]::ToLower($_) } else { $_ } })
                    $dir = Join-Path $dl (($esc -replace '/','\') + "\@v")
                    New-Item -ItemType Directory -Force -Path $dir | Out-Null
                    foreach ($ext in 'info','mod','zip') {
                      $out = Join-Path $dir "$ver.$ext"
                      curl.exe -s -L --tlsv1.2 --retry 3 -o $out "https://proxy.golang.org/$esc/@v/$ver.$ext"
                      if (-not (Test-Path $out) -or (Get-Item $out).Length -eq 0) {
                        throw "Failed to fetch $esc/@v/$ver.$ext"
                      }
                    }
                    Write-Host "cached $mod $ver"
                  }
                  $env:GOMODCACHE = $cache
                }

                # Build/run entirely from the module cache — no network.
                $env:GOPROXY = "off"
                $env:GOSUMDB = "off"
                go test -tags e2e -count=1 -v -run '^TestManagedIdentityAzureArc' ./apps/tests/e2e/...
